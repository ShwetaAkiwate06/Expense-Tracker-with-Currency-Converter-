<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Finance Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="login-container">
    <h1>Finance Tracker</h1>

    <!-- Login Type Selection -->
    <div class="toggle-group">
      <button id="emailLoginBtn" class="btn active">Email</button>
      <button id="phoneLoginBtn" class="btn">Mobile</button>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      
      <!-- Email Input -->
      <div id="email-field">
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <!-- Phone Input -->
      <div id="phone-field" style="display:none;">
        <input
          type="tel"
          id="phone"
          placeholder="Enter mobile number (+91...)"
        />
      </div>

      <!-- Send OTP -->
      <button type="button" id="sendOtpBtn" class="btn">
        Send OTP
      </button>

      <!-- OTP Input -->
      <div id="otp-field" style="display:none;">
        <input
          type="text"
          id="otp"
          placeholder="Enter OTP"
        />
        <button type="button" id="verifyOtpBtn" class="btn">
          Verify OTP
        </button>
      </div>

    </form>
  </div>

  <script src="config.js"></script>
<script src="login.js"></script>

</body>
</html>
