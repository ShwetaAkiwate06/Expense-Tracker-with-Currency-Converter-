<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>

<body>
    <nav class="navbar">
        <div class="logo">Finance Tracker</div>
        <div class="nav-links">
            <a href="home.html" class="nav-link active">Home</a>
            <a href="expenses.html" class="nav-link">Expenses</a>
            <a href="converter.html" class="nav-link">Converter</a>
            <button id="theme-toggle" class="nav-link"
                style="border:none; background:none; cursor:pointer; font-size: 1.2em;">
                🌙
            </button>
        </div>
        <div class="profile">
            <div class="profile-pic" id="profile-icon">U</div>
            <div class="profile-dropdown">
                <div class="profile-name" id="profile-username">User</div>
                <button id="logout-btn" class="btn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="page">
        <div class="stats-container">
            <div class="stat-box">
                <h3>Total</h3>
                <p class="total-amount">₹0</p>
            </div>
            <div class="stat-box">
                <h3>Monthly Expense</h3>
                <p class="monthly-expense">₹0</p>
            </div>
            <div class="stat-box">
                <h3>Budget</h3>
                <p class="budget-amount">₹0</p>
            </div>
        </div>
        <div class="charts-container">

            <div class="chart-box">
                <h3>Monthly Expenses</h3>
                <select id="monthSelect">
                    <option value="1">Jan</option>
                    <option value="2">Feb</option>
                    <option value="3">Mar</option>
                    <option value="4">Apr</option>
                    <option value="5">May</option>
                    <option value="6">Jun</option>
                    <option value="7">Jul</option>
                    <option value="8">Aug</option>
                    <option value="9">Sep</option>
                    <option value="10">Oct</option>
                    <option value="11">Nov</option>
                    <option value="12">Dec</option>
                </select>

                <select id="yearSelect">
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                </select>


                <canvas id="monthlyChart"></canvas>
            </div>
            <div class="chart-box">
                <h3>Spending Categories</h3>
                <canvas id="category-chart"></canvas>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="profile.js"></script>
    <script src="dark.js"></script>
    <script src="home.js"></script>

    <script src="logout.js"></script>
</body>

</html>
